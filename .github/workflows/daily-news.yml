name: Daily crypto news

on:
  schedule:
    # 07:00 UTC: refresh the news radar before the day starts.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Collect news and write the digest
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}
        run: python -m app.news.collector

      # Only the radar's own files are ever committed by this workflow.
      - name: Commit news data
        run: |
          git add backend/data/news docs/news
          if git diff --cached --quiet; then
            echo "No news changes today."
            exit 0
          fi
          git config user.name "monsterbroker-bot"
          git config user.email "81918923+alvrichh@users.noreply.github.com"
          git commit -m "News radar update - $(date -u +'%Y-%m-%d')"
          git push
