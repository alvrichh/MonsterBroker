<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MonsterBroker: bot de trading cripto en papel, radar de noticias y wallet web3.">
  <title>MonsterBroker</title>

  <!-- Link previews (WhatsApp, X, LinkedIn…). Most scrapers need an absolute
       og:image URL: swap the path for https://<your-domain>/images/brand/og.png
       once the site has its public domain. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MonsterBroker">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="MonsterBroker · Opera como un bicho. Sin jugarte un duro.">
  <meta property="og:description" content="Bot de trading cripto en papel sobre velas reales de Binance, radar diario de noticias y wallet web3.">
  <meta property="og:image" content="/images/brand/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MonsterBroker: Opera como un bicho. Sin jugarte un duro.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="/images/brand/og.png">
  <meta name="theme-color" content="#0f3a50">

  <link rel="icon" href="/images/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/brand/favicon-192.png">
  <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <script>
    // Apply the saved theme before first paint to avoid a flash. Dark is the
    // house style, inherited from the original MonsterBroker page.
    try {
      document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
