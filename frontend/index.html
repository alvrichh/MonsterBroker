<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MonsterBroker: bot de trading cripto en papel, radar de noticias y wallet web3.">
  <title>MonsterBroker</title>

  <link rel="icon" type="image/png" href="/images/brand/logo.png">
  <link rel="apple-touch-icon" href="/images/brand/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <script>
    // Apply the saved theme before first paint to avoid a flash. Dark is the
    // house style, inherited from the original MonsterBroker page.
    try {
      document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
